name: Run Test Matrix

on:
  workflow_dispatch:
    inputs:
      run_playwright_full:
        description: "Also run the full Playwright suite"
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      run_playwright_full:
        description: "Also run the full Playwright suite"
        type: boolean
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  tests:
    name: ${{ matrix.label }} (Required)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django: "5.2"
            constraints-file: "requirements/constraints-django52.txt"
            label: "Python 3.12 / Django 5.2"
          - python-version: "3.12"
            django: "6.0"
            constraints-file: "requirements/constraints-django60.txt"
            label: "Python 3.12 / Django 6.0"
          - python-version: "3.13"
            django: "5.2"
            constraints-file: "requirements/constraints-django52.txt"
            label: "Python 3.13 / Django 5.2"
          - python-version: "3.13"
            django: "6.0"
            constraints-file: "requirements/constraints-django60.txt"
            label: "Python 3.13 / Django 6.0"
          - python-version: "3.14"
            django: "5.2"
            constraints-file: "requirements/constraints-django52.txt"
            label: "Python 3.14 / Django 5.2"
          - python-version: "3.14"
            django: "6.0"
            constraints-file: "requirements/constraints-django60.txt"
            label: "Python 3.14 / Django 6.0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Cache uv downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.django }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'requirements/constraints-*.txt') }}

      - name: Install test dependencies
        run: |
          PYTHON="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --python "$PYTHON" --constraint "${{ matrix.constraints-file }}" ".[tests-core]"

      - name: Run pytest
        run: pytest -m "not playwright"

      - name: Run focused Bootstrap server coverage
        if: matrix.python-version == '3.14'
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_bootstrap
        run: |
          pytest -m "not playwright" --cov-append --no-cov-on-fail \
            src/tests/test_bootstrap_template_pack.py \
            src/tests/test_template_pack_behaviour_matrix.py \
            src/tests/test_form_filter_template_mixins.py::test_generated_datetime_form_and_filter_use_true_datetime_controls \
            src/tests/test_form_mixin_extended.py::test_custom_model_form_uses_pack_policy_only_for_silent_default_widgets \
            src/tests/test_inline_editing_mixin.py::test_generated_inline_m2m_requests_pack_multiselect_enhancement \
            src/tests/test_bulk_view_mixin.py::test_bulk_field_info_uses_policy_owned_controls_for_selects

      - name: Preserve canonical core coverage data
        if: matrix.python-version == '3.14' && matrix.django == '6.0'
        run: cp .coverage coverage-core.sqlite

      - name: Upload canonical core coverage data
        if: matrix.python-version == '3.14' && matrix.django == '6.0'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-py314-django60
          path: coverage-core.sqlite

  playwright-smoke:
    name: Python 3.14 / Django 6.0 / Playwright Smoke (Required)
    runs-on: ubuntu-latest
    needs: tests
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Python dependencies
        run: |
          PYTHON="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --python "$PYTHON" --constraint requirements/constraints-django60.txt ".[tests-core]" ".[tests-ui]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Build static assets
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: python -m playwright install --with-deps chromium

      - name: Download canonical core coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-core-py314-django60
          path: .

      - name: Restore canonical core coverage data
        run: mv coverage-core.sqlite .coverage

      - name: Run Playwright smoke suite with coverage append
        run: pytest -m playwright_smoke --cov-append --no-cov-on-fail

      - name: Run focused Bootstrap Playwright coverage
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_bootstrap
        run: |
          pytest -m playwright --cov-append --no-cov-on-fail \
            src/tests/playwright/test_bootstrap_modal_presentation.py \
            src/tests/playwright/test_bootstrap_manual_static_assets.py \
            src/tests/playwright/test_modal_crud.py::test_modal_multiselect_uses_pack_widget_and_clear_all \
            src/tests/playwright/test_inline_editing.py::test_inline_m2m_uses_compact_pack_multiselect

      - name: Generate combined coverage report
        run: coverage xml

      - name: Upload combined coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  playwright-full:
    name: Playwright Full / Django 6.0 (Manual)
    if: ${{ inputs.run_playwright_full }}
    continue-on-error: true
    outputs:
      suite_status: ${{ steps.capture_status.outputs.suite_status }}
    runs-on: ubuntu-latest
    needs:
      - tests
      - playwright-smoke
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Python dependencies
        run: |
          PYTHON="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --python "$PYTHON" --constraint requirements/constraints-django60.txt ".[tests-core]" ".[tests-ui]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Build static assets
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: python -m playwright install --with-deps chromium

      - name: Run full Playwright suite
        id: full_suite
        continue-on-error: true
        run: pytest -m playwright --no-cov-on-fail

      - name: Capture non-blocking suite status
        id: capture_status
        if: always()
        run: |
          suite_status="success"
          if [[ "${{ steps.full_suite.outcome }}" == "failure" ]]; then
            suite_status="failure"
          fi
          echo "suite_status=${suite_status}" >> "$GITHUB_OUTPUT"

      - name: Summarise non-blocking regression outcome
        if: always()
        run: |
          if [[ "${{ steps.capture_status.outputs.suite_status }}" == "failure" ]]; then
            echo "::warning::Manual Playwright regression suite failed. Review the 'Playwright Full (Manual)' job."
            {
              echo "## Manual Browser Regression"
              echo
              echo "Playwright smoke passed, but the manually requested full Playwright regression suite failed."
              echo "Review the 'Playwright Full (Manual)' job."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Manual Browser Regression"
              echo
              echo "The manually requested full Playwright regression suite passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  playwright-summary:
    name: Browser Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - tests
      - playwright-smoke
      - playwright-full
    steps:
      - name: Summarise browser check outcomes
        env:
          REQUIRED_TESTS_RESULT: ${{ needs.tests.result }}
          REQUIRED_SMOKE_RESULT: ${{ needs.playwright-smoke.result }}
          FULL_RESULT: ${{ needs.playwright-full.result }}
          FULL_SUITE_STATUS: ${{ needs.playwright-full.outputs.suite_status }}
        run: |
          {
            echo "## Browser Check Summary"
            echo
            echo "- Required Python matrix: ${REQUIRED_TESTS_RESULT}"
            echo "- Required Playwright smoke: ${REQUIRED_SMOKE_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${FULL_RESULT}" == "skipped" ]]; then
            {
              echo "- Manual Playwright full: not requested"
              echo
              echo "The full Playwright regression suite was not requested for this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          full_suite_status="${FULL_SUITE_STATUS:-unknown}"

          {
            echo "- Manual Playwright full: ${full_suite_status}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${full_suite_status}" == "failure" ]]; then
            {
              echo "Playwright smoke passed, but the manually requested full Playwright regression suite failed."
              echo "Review the 'Playwright Full (Manual)' job."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All configured browser checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi
